name: Desktop shell builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev dpkg-dev librsvg2-bin
      - name: Install pinned AppImage tool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/appimagetool"
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o appimagetool.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage' | sha256sum --check --strict
          chmod +x appimagetool.AppImage
          # 解包后直接运行，避免 CI 环境依赖 FUSE 挂载。
          ./appimagetool.AppImage --appimage-extract > /dev/null
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$RUNNER_TEMP/appimagetool/squashfs-root/AppRun" > "$RUNNER_TEMP/bin/appimagetool"
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: macOS icon tool
        if: runner.os == 'Macos'
        run: brew install librsvg
      - name: Windows packaging tools
        if: runner.os == 'Windows'
        run: choco install nsis imagemagick -y
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29
      - run: npm ci
        working-directory: frontend
      - run: go vet ./...
      - run: go test -race ./...
      - run: npm test
        working-directory: frontend
      # 官方 SVG 已获所有者授权；每次构建生成图标，不吞掉生成失败。
      - name: Generate app icons
        run: bash scripts/make-icons.sh
      - run: wails3 task package
      - name: Build platform installers
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then wails3 task windows:nsis; fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            wails3 task linux:deb
            wails3 task linux:appimage
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AidoChat-${{ runner.os }}
          path: |
            build/bin/*.zip
            build/bin/*.tar.gz
            build/bin/*.dmg
            build/bin/*.deb
            build/bin/*.AppImage
            build/bin/*-setup.exe
          if-no-files-found: error
