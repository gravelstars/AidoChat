version: '3'
info:
  companyName: ai-group-chat
  productName: ai-group-chat
  productIdentifier: local.ai-group-chat
  description: 本地 AI 群聊
  version: 0.1.0
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin]
    file: [.DS_Store, .gitignore, '*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
      readiness:
        http: http://127.0.0.1:5173/
        timeout: 60s
        interval: 200ms
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
