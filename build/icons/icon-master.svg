<?xml version="1.0" encoding="UTF-8"?>
<!--
  应用图标母版（TASK-012）。1024×1024，造型照 侧栏印记 + Seal 组件：方形、16% 圆角、内框，
  墨色底、纸色「议」字。圆角半径 1024×16% ≈ 164，内框内缩 7% ≈ 72。
  颜色取「案头」的墨与宣纸近似值；正式生成前请项目所有者确认造型与取色。
  用途：scripts/make-icons.sh 会把它渲染成各平台尺寸（需本机具备 SVG 光栅化工具）。
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1024" height="1024" rx="164" ry="164" fill="#23211c"/>
  <rect x="72" y="72" width="880" height="880" rx="110" ry="110" fill="none" stroke="#f4f0e6" stroke-width="18"/>
  <text x="512" y="512" fill="#f4f0e6"
        font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',serif"
        font-size="560" font-weight="700" text-anchor="middle" dominant-baseline="central">议</text>
</svg>
